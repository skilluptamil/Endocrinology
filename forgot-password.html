<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – EndoCare Clinic</title>
  <meta name="description" content="Reset your EndoCare patient health portal password. Receive a secure reset link via email.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-alt d-flex flex-column min-vh-100">

  <div class="container py-3 d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="index.html">
      <span class="brand-icon"><i class="bi bi-activity"></i></span>
      <span>Endo<span class="brand-text-accent">Care</span></span>
    </a>
    <div class="d-flex align-items-center gap-2">
      <button type="button" class="btn-control-icon rtl-toggle-btn" title="Toggle RTL">
        <span class="rtl-text fw-bold small">RTL</span>
      </button>
      <button type="button" class="btn-control-icon theme-toggle-btn" title="Toggle Theme">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <a href="index.html" class="btn btn-sm btn-outline-custom">
        <i class="bi bi-house"></i> Public Home
      </a>
    </div>
  </div>

  <div class="container my-auto py-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5 bg-surface text-center">
          
          <div class="brand-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
            <i class="bi bi-key-fill"></i>
          </div>
          <h2 class="h3 fw-bold mb-2">Forgot Your Password?</h2>
          <p class="text-muted small mb-4">
            Enter the email address registered with your EndoCare patient account, and we will dispatch a secure reset link.
          </p>

          <form id="forgotForm">
            <div class="mb-4 text-start">
              <label for="forgotEmail" class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-surface text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" id="forgotEmail" class="form-control" placeholder="eleanor.vance@example.com" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
              Send Password Reset Link <i class="bi bi-send ms-1"></i>
            </button>

            <div>
              <a href="reset-password.html" class="small text-muted d-block mb-3">
                Already have a reset code? <span class="text-primary fw-semibold">Reset Password</span>
              </a>
            </div>

            <div class="pt-3 border-top">
              <a href="login.html" class="fw-bold text-primary small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Login
              </a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 text-center text-muted small border-top bg-surface mt-auto">
    <div class="container">
      &copy; 2026 EndoCare Clinic. Patient Security Services.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
