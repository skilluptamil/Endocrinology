<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal Sign In – EndoCare Clinic</title>
  <meta name="description" content="Secure login to the EndoCare Patient Health Portal. Access your blood sugar logs, doctor appointments, and test results.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  
  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Core Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-alt d-flex flex-column min-vh-100">

  <!-- Top Nav Controls (Theme, RTL, Home Link) -->
  <div class="container py-3 d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="index.html">
      <span class="brand-icon"><i class="bi bi-activity"></i></span>
      <span>Endo<span class="brand-text-accent">Care</span></span>
    </a>
    <div class="d-flex align-items-center gap-2">
      <button type="button" class="btn-control-icon rtl-toggle-btn" title="Toggle RTL" aria-label="Toggle text direction">
        <span class="rtl-text fw-bold small">RTL</span>
      </button>
      <button type="button" class="btn-control-icon theme-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <a href="index.html" class="btn btn-sm btn-outline-custom">
        <i class="bi bi-house"></i> Public Home
      </a>
    </div>
  </div>

  <!-- Breadcrumb Navigation -->
  <div class="container mt-2">
    <nav aria-label="breadcrumb" class="breadcrumb-nav-wrapper">
      <ol class="breadcrumb hero-breadcrumb-pill">
        <li class="breadcrumb-item"><a href="index.html"><i class="bi bi-house"></i><span>Home</span></a></li>
        <li class="breadcrumb-item active" aria-current="page"><span>Login</span></li>
      </ol>
    </nav>
  </div>

  <!-- Main Login Card Container -->
  <div class="container my-auto py-3">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5 bg-surface">
          
          <div class="text-center mb-4">
            <h2 class="h3 fw-bold mb-1">Welcome Back</h2>
            <p class="text-muted small">Select your portal role and sign in to access your dashboard.</p>
            
            <!-- Dashboard Portal Role Selector -->
            <div class="btn-group w-100 p-1 bg-alt rounded-pill border mt-3" role="group" id="portalRoleSelector">
              <input type="radio" class="btn-check" name="portalRole" id="roleCustomer" value="customer" checked autocomplete="off">
              <label class="btn btn-sm rounded-pill fw-semibold py-2" for="roleCustomer">
                <i class="bi bi-clipboard2-pulse me-1"></i> Customer / Patient
              </label>

              <input type="radio" class="btn-check" name="portalRole" id="roleUser" value="user" autocomplete="off">
              <label class="btn btn-sm rounded-pill fw-semibold py-2" for="roleUser">
                <i class="bi bi-person-circle me-1"></i> User Account
              </label>
            </div>
          </div>

          <!-- Login Form -->
          <form id="loginForm">
            <!-- Hidden Role Input -->
            <input type="hidden" id="loginTargetPortal" value="customer">

            <!-- Email Field -->
            <div class="mb-3">
              <label for="loginEmail" class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-surface text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" id="loginEmail" class="form-control" placeholder="eleanor.vance@example.com" value="eleanor.vance@example.com" required>
              </div>
            </div>

            <!-- Password Field with Show/Hide Toggle -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="loginPassword" class="form-label small fw-semibold m-0">Password</label>
                <a href="forgot-password.html" class="small text-primary text-decoration-none">Forgot Password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-surface text-muted"><i class="bi bi-key"></i></span>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="password123" required>
                <button type="button" class="btn btn-outline-secondary password-toggle-btn" data-target="loginPassword" title="Show/Hide Password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <!-- Remember Me Checkbox -->
            <div class="mb-4 d-flex justify-content-between align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMeCheck" checked>
                <label class="form-check-label small text-muted" for="rememberMeCheck">
                  Remember my session on this device
                </label>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3" id="loginSubmitBtn">
              Sign In to Customer Dashboard <i class="bi bi-arrow-right"></i>
            </button>

            <!-- Divider -->
            <div class="position-relative text-center my-4">
              <hr class="border-secondary-subtle">
              <span class="position-absolute top-50 start-50 translate-middle px-3 bg-surface text-muted small">or continue with</span>
            </div>

            <!-- Social Login Buttons (Frontend Demo) -->
            <div class="row g-2 mb-4">
              <div class="col-6">
                <button type="button" class="btn btn-outline-custom w-100 py-2 btn-google-auth small">
                  <i class="bi bi-google text-danger me-1"></i> Google
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-custom w-100 py-2 btn-facebook-auth small">
                  <i class="bi bi-facebook text-primary me-1"></i> Facebook
                </button>
              </div>
            </div>

            <!-- Link to Sign Up -->
            <div class="text-center pt-2 border-top">
              <small class="text-muted">
                Don't have a patient account yet? 
                <a href="register.html" class="fw-bold text-primary text-decoration-none">Create Account</a>
              </small>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

  <!-- Minimal Footer -->
  <footer class="py-3 text-center text-muted small border-top bg-surface mt-auto">
    <div class="container">
      &copy; 2026 EndoCare Clinic. Secure Patient Health Portal Demo.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
